[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mot"
version = "0.1.0"
description = "Mixture of Thoughts: latent-space collaboration among frozen heterogeneous LLM experts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=5.0",
    "kernels>=0.10",
    "accelerate>=1.0",
    "omegaconf>=2.3",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",
    "protobuf>=4",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
include = ["mot*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
